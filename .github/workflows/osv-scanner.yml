name: OSV-Scanner

# Scans each pull request and reports only the vulnerabilities it introduces.
on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  # Required to upload the SARIF file to CodeQL.
  actions: read
  # Required to write security events to the Security tab.
  security-events: write
  contents: read

jobs:
  scan-pr:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
