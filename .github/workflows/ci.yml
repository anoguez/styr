name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]

# A new push supersedes the run in flight for the same PR: its server bundles (two container builds
# per push) and the rest of the jobs would only report on a commit that is already out of date.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: yarn

      # Native modules are only needed to run the app, not to typecheck, lint or bundle it.
      - run: yarn install --frozen-lockfile --ignore-scripts

      - run: yarn lint
      - run: yarn format:check
      - run: yarn build
      - run: yarn test:coverage
      - run: yarn coverage:check

  # Paths, shells and key handling differ on Windows; the suite and the bundle must hold there too.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --frozen-lockfile --ignore-scripts

      - run: yarn build
      - run: yarn test

  # Starts the built app under Electron and drives it through the core flows (e2e/*.e2e.ts,
  # docs/architecture/testing.md). Unlike the jobs above it runs the app, so the install keeps its
  # scripts: Electron downloads its binary and postinstall builds the native modules for its ABI.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: yarn

      # Electron's postinstall downloads its binary (~100 MB); keep it between runs. The lockfile
      # pins the Electron version, so it is the key.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - run: yarn install --frozen-lockfile

      # Builds, then runs the smoke test against `out/` on a virtual display.
      - run: xvfb-run --auto-servernum yarn test:smoke

      # `styr serve` under plain Node, driven over its socket, then the desktop's remote client
      # against it (no ssh). The check job installs without scripts, so node-pty is not built
      # there and these skip; here a skip is a failure.
      - run: yarn vitest run src/server/serve.integration.test.ts src/host/remote/client.integration.test.ts
        env:
          STYR_SERVER_INTEGRATION: '1'

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-test-results
          path: test-results/
          retention-days: 7

  # Whether the PR touches what only breaks on another OS: dependencies, packaging, the build and
  # its scripts, resources. The smoke on macOS and Windows (smoke-native) runs only then; a git
  # diff against the base needs no extra action to pin. A Dependabot bump of electron, node-pty or
  # better-sqlite3 changes package.json and yarn.lock, so it always qualifies.
  changes:
    runs-on: ubuntu-latest
    outputs:
      risky: ${{ steps.diff.outputs.risky }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its first parent, the base branch's tip.
          fetch-depth: 2

      - id: diff
        run: |
          files="$(git diff --name-only HEAD^1 HEAD)"
          echo "$files"
          if echo "$files" | grep -Eq '^(package\.json|yarn\.lock|electron-builder\.yml|electron\.vite\.config\.ts|scripts/|build/|resources/|\.github/workflows/ci\.yml)'; then
            echo "risky=true" >> "$GITHUB_OUTPUT"
          else
            echo "risky=false" >> "$GITHUB_OUTPUT"
          fi

  # The same Electron smoke and feature tests as `smoke`, on macOS and Windows, for a risky change
  # only. Ubuntu's `smoke` stays a job of its own so it is a stable required check and runs on every
  # PR. Windows installs the N-API prebuilds (scripts/postinstall.mjs skips the rebuild there).
  smoke-native:
    needs: changes
    if: ${{ needs.changes.outputs.risky == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn test:smoke

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-test-results-${{ matrix.os }}
          path: test-results/
          retention-days: 7

  # The server bundles, x64 and arm64, built and self-checked exactly as the release builds them
  # (server-bundle.yml), so a bundle that will not build or run fails here rather than at release.
  server-bundle:
    permissions:
      contents: read
    uses: ./.github/workflows/server-bundle.yml
