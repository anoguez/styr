name: Server bundle

# The Styr server bundles for remote workspaces (docs/architecture/remote.md): one per Linux arch,
# each with its own Node runtime and node-pty / better-sqlite3 built for that Node's ABI. Built on
# a native runner of each arch, inside Debian bookworm, so the bundles need glibc 2.36 (Ubuntu
# 22.04+, Debian 12+, RHEL 9+; better-sqlite3's prebuilt binary alone needs 2.33). The floor is
# GLIBC_FLOOR in resources/server/install.sh: change it with the container.
#
# The only definition of the build: CI runs it on every PR (ci.yml) and the release builds the
# published bundles with it (release.yml), so a bundle that does not build or does not pass its
# self-check fails the PR, not the release.

on:
  workflow_call:
    inputs:
      ref:
        description: What to check out and build (empty for the commit that triggered the run)
        type: string
        default: ''
      upload:
        description: Keep each bundle as a workflow artifact, for the release's later jobs
        type: boolean
        default: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: node:24-bookworm
    # Normally about a minute; a stuck step should fail the PR, not hold it for the 6-hour default.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      # No scripts: the server never loads the Electron-ABI native builds, and needs no Electron.
      # scripts/server-bundle.mjs installs node-pty and better-sqlite3 for its own Node, then runs
      # the bundle with its own Node and native modules (its self-check), failing the job if not.
      # The container has no setup-node, so no yarn cache: keep it here, per arch (the runners differ).
      - id: yarn-cache
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ matrix.arch }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ matrix.arch }}-

      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn build:server
      - run: node scripts/server-bundle.mjs

      - if: ${{ inputs.upload }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: styr-server-linux-${{ matrix.arch }}
          path: dist/styr-server-*-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
