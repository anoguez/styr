  # The Linux build is disabled until the .deb and AppImage have been tested more. To turn it back
  # on, uncomment this job and add `build-linux` back to `publish` (its `needs` and its `if`).
  # # Also what runs under WSL2 (WSLg) on Windows. Builds on Linux, because node-pty ships no Linux
  # # prebuild and is compiled against Electron here by postinstall.
  # build-linux:
