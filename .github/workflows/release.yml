name: Release

on:
  push:
    branches: [main]
  # Manual run: a full signed and notarised macOS build. Without a tag it is kept as a workflow
  # artifact, to check signing before cutting a release; with one, that tag is rebuilt and its
  # release gets the files, which recovers a release whose build failed.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and attach the DMG to (e.g. v0.2.0)
        required: false
        default: ''

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # A PR opened with GITHUB_TOKEN does not trigger other workflows, so CI would never run on
          # the release PR. A fine-grained PAT in RELEASE_PLEASE_TOKEN avoids that.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Refreshes the README coverage badge when a release is cut, not on ordinary merges: CI only
  # fails when coverage falls, so the badge is allowed to lag until then.
  coverage-badge:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: yarn coverage:badge

      - name: Commit the badge
        run: |
          if git diff --quiet README.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh coverage badge" README.md
          git pull --rebase origin main
          git push origin HEAD:main

  build-macos:
    needs: release-please
    # always() lets a manual run proceed although release-please was skipped.
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created) }}
    # macos-latest is Apple silicon, matching the arm64-only target.
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      # Empty on a manual run without a tag, which builds the commit the run was started from.
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: yarn

      # postinstall rebuilds node-pty and better-sqlite3 against Electron's ABI.
      - run: yarn install --frozen-lockfile

      - run: yarn build

      # The keychain is set up here rather than by handing CSC_LINK to electron-builder: its own
      # temporary keychain fails `set-key-partition-list` on the macOS runners ("passphrase not
      # correct"), which is what broke the v0.2.0 build.
      - name: Import the signing certificate
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$password" "$KEYCHAIN"

          # The runner does not trust Developer ID certificates out of the box: without Apple's
          # intermediates the identity is invalid and electron-builder silently falls back to any
          # other identity in the .p12 (an Apple Development one, which notarisation rejects).
          # Fingerprints are pinned so a tampered download is never trusted.
          for ca in DeveloperIDCA:3B166C3B7DC4B751C9FE2AFAB9135641E388E186 \
                    DeveloperIDG2CA:5B45F61068B29FCC8FFFF1A7E99B78DA9E9C4635; do
            name="${ca%%:*}"
            curl -fsSL -o "$RUNNER_TEMP/$name.cer" "https://www.apple.com/certificateauthority/$name.cer"
            actual="$(openssl x509 -inform der -in "$RUNNER_TEMP/$name.cer" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d :)"
            [ "$actual" = "${ca#*:}" ] || { echo "::error::$name.cer fingerprint mismatch"; exit 1; }
            security import "$RUNNER_TEMP/$name.cer" -k "$KEYCHAIN"
          done

          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          rm -f "$RUNNER_TEMP/certificate.p12"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$KEYCHAIN"

          # Name the Developer ID identity explicitly, and stop here if there is none.
          identity="$(security find-identity -v -p codesigning "$KEYCHAIN" |
            sed -n 's/.*"Developer ID Application: \(.*\)"$/\1/p' | head -1)"
          if [ -z "$identity" ]; then
            echo "::error::CSC_LINK has no valid Developer ID Application identity"
            security find-identity -p codesigning "$KEYCHAIN"
            exit 1
          fi
          echo "Signing as: Developer ID Application: $identity"
          echo "CSC_NAME=$identity" >> "$GITHUB_ENV"
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      # electron-builder finds the Developer ID in that keychain, signs the app and DMG, and notarises
      # the app because the APPLE_* variables are present; scripts/notarize-dmg.mjs then notarises
      # and staples the DMG.
      - name: Package, sign and notarise
        run: yarn electron-builder --mac --publish never
        env:
          CSC_KEYCHAIN: ${{ env.KEYCHAIN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify signature and notarisation
        run: |
          app="dist/mac-arm64/Styr.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose "$app"
          xcrun stapler validate "$app"
          for dmg in dist/*.dmg; do
            spctl --assess --type open --context context:primary-signature --verbose "$dmg"
            xcrun stapler validate "$dmg"
          done

      - name: Keep the build as a workflow artifact
        if: ${{ env.TAG == '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: styr-macos
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml

      - name: Upload to release
        if: ${{ env.TAG != '' }}
        # The zip, its blockmap and latest-mac.yml are the update feed installed copies read.
        run: gh release upload "$TAG" dist/*.dmg dist/*.zip dist/*.zip.blockmap dist/latest-mac.yml --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove the signing keychain
        if: ${{ always() }}
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  # The Windows build is disabled until the installer has been tested more. To turn it back on,
  # uncomment this job and add `build-windows` back to `publish` (its `needs` and its `if`).
  # # Unsigned for now (no Windows certificate): Windows shows a SmartScreen prompt on first run.
  # build-windows:
