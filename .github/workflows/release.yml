  #       # electron-builder can leave its intermediate uninstaller exe in dist/.
  #       run: gh release upload "$TAG" dist/Styr-Setup-*.exe dist/Styr-Setup-*.exe.blockmap dist/latest.yml --clobber
  #       env:
