  #       run: gh release upload "$TAG" dist/*.AppImage dist/*.deb dist/latest-linux.yml --clobber
  #       env:
  #         GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # release-please creates the release as a draft (see release-please-config.json), so nothing is
  # public — and installed copies see no new version — until every platform's files are attached.
  # A failed build leaves the draft unpublished rather than a release with files missing.
  publish:
    needs: [release-please, build-macos]
    if: ${{ always() && needs.build-macos.result == 'success' && (needs.release-please.outputs.tag_name || inputs.tag) != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
