  #       if: ${{ env.TAG == '' }}
  #       uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
  #       with:
  #         name: styr-windows
  #         path: |
  #           dist/Styr-Setup-*.exe
  #           dist/latest.yml
  #
  #     - name: Upload to release
  #       if: ${{ env.TAG != '' }}
