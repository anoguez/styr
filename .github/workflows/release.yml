  #       shell: bash
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #       with:
  #         ref: ${{ env.TAG }}
  #
  #     - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
  #       with:
  #         node-version: 24
  #         cache: yarn
  #
  #     # postinstall skips the native rebuild on Windows: node-pty and better-sqlite3 load their
  #     # N-API prebuilds (see scripts/postinstall.mjs).
  #     - run: yarn install --frozen-lockfile
  #
  #     - run: yarn build
  #
  #     - name: Package
  #       run: yarn electron-builder --win --x64 -c.npmRebuild=false --publish never
  #
