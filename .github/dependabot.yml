# Actions are pinned to commit SHAs (the release job holds the signing secrets, and a tag can be
# moved). Dependabot keeps those pins current by opening a PR for each new release.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  # A new npm release waits a week before Dependabot proposes it, so a hijacked-maintainer
  # publish is usually caught and pulled first. Security updates ignore the cooldown.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # Everything but the packages whose break is a packaged-app break (the exclusions below):
      # those get one PR each, so a failure is attributable. Dependabot has no per-package
      # "ungrouped" switch; a dependency matching no group is already its own PR.
      minor-and-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - electron
          - electron-builder
          - electron-vite
          - better-sqlite3
          - node-pty
          - typescript
          - '@typescript/*'
    commit-message:
      prefix: ci
