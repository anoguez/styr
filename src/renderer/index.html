<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Styr</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The renderer's CSP (docs/architecture/remote.md, Trust boundary): scripts only from the
         app's own files, never inline or eval'd; no network but the app's own origin (the dev
         server's HMR socket); no plugins, frames, forms or <base>. Inline styles stay: React's
         style props and xterm set them. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
