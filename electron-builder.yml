appId: com.andersonnoguez.styr
productName: Styr
directories:
  buildResources: resources
  output: dist
afterAllArtifactBuild: scripts/notarize-dmg.mjs
files:
  - out/**
  - package.json
# The OFL requires the licence to travel with the bundled wordmark font.
extraResources:
  - from: node_modules/@fontsource/unbounded/LICENSE
    to: licenses/Unbounded-OFL.txt
  # Loaded by Claude Code, a separate process, so it ships as plain files rather than in the asar.
  - from: resources/claude
    to: claude
  # Styr Terminal (experimental), when the release job vendored it. Kept out of the asar so the
  # .node loads, and signed with the rest of the bundle. Absent in a public build: the app then runs
  # on xterm.js only. See docs/architecture/terminal-engine.md.
  - from: resources/native
    to: native
    filter:
      - '**/*'
      - '!README.md'
asarUnpack:
  - '**/node_modules/node-pty/**'
  - '**/node_modules/better-sqlite3/**'
  # The MCP server is launched by plain `node`, which cannot read inside an asar archive.
  - 'out/main/**'
# The update feed. electron-updater reads it from app-update.yml, which this block makes
# electron-builder write into the app; releases themselves are published by the workflow.
publish:
  provider: github
  owner: anoguez
  repo: styr
mac:
  target:
    # The DMG is for people installing by hand. The zip is what electron-updater downloads, and
    # latest-mac.yml (written alongside) is how an installed copy learns it exists.
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  category: public.app-category.developer-tools
  # Signed with the Developer ID found in the keychain (locally) or decoded from CSC_LINK (CI), and
  # notarised when APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID are set. Without a
  # Developer ID, use `yarn package:adhoc`: skipping signing altogether leaves the bundle's
  # resources unsealed, which macOS reports as "damaged" on any machine that applies Gatekeeper.
  hardenedRuntime: true
  gatekeeperAssess: false
  # The hardened runtime enforces library validation, which blocks the bundled native modules
  # (node-pty, better-sqlite3) under an ad-hoc signature, so it stays disabled for that path.
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
win:
  # The NSIS installer is both what people download and what electron-updater installs; latest.yml
  # (written alongside) is the Windows update feed, as latest-mac.yml is for macOS.
  target:
    - target: nsis
      arch: x64
  # Derived from icon.svg by `yarn icon`; electron-builder converts it to .ico.
  icon: resources/icon.png
  # Unsigned for now: Windows shows a SmartScreen prompt on first run. No signing secrets are needed,
  # and electron-updater skips publisher verification for an unsigned app.
linux:
  # The .deb is the easy install on Ubuntu, including under WSL2 (sudo apt install ./Styr…deb). The
  # AppImage is what electron-updater updates in place; latest-linux.yml is its feed. An AppImage
  # needs FUSE 2 (libfuse2t64 on Ubuntu 24.04), or --appimage-extract-and-run.
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
  icon: resources/icon.png
  category: Development
  executableName: styr
  synopsis: Kanban board that dispatches AI coding agents
  maintainer: Anderson Noguez <2653291+anoguez@users.noreply.github.com>
  artifactName: Styr-${version}-${arch}.${ext}
  # Neither the window nor the tray gets an icon from the executable on Linux (see appIcon.ts).
  extraResources:
    - from: resources/icon.png
      to: icon.png
deb:
  # Electron's runtime libraries; WSL2 distros in particular often lack libnss3 and libasound2.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2
    # GPU buffer management Chromium loads at startup; a minimal or WSL distro may not have Mesa's.
    - libgbm1
nsis:
  # A per-user install needs no administrator rights, so updates install without a UAC prompt.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Styr
  artifactName: Styr-Setup-${version}.${ext}
  # Agents keep their data in ~/.styr and the workspace folders, never in the install directory.
  deleteAppDataOnUninstall: false
dmg:
  # Sign the DMG itself, not just the app inside it. scripts/notarize-dmg.mjs then notarises and
  # staples it: a signed but unnotarised DMG is rejected by Gatekeeper.
  sign: true
