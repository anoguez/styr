appId: com.andersonnoguez.styr
productName: Styr
directories:
  buildResources: resources
  output: dist
afterAllArtifactBuild: scripts/notarize-dmg.mjs
files:
  - out/**
  - package.json
# The OFL requires the licence to travel with the bundled wordmark font.
extraResources:
  - from: node_modules/@fontsource/unbounded/LICENSE
    to: licenses/Unbounded-OFL.txt
  # Loaded by Claude Code, a separate process, so it ships as plain files rather than in the asar.
  - from: resources/claude
    to: claude
asarUnpack:
  - '**/node_modules/node-pty/**'
  - '**/node_modules/better-sqlite3/**'
  # The MCP server is launched by plain `node`, which cannot read inside an asar archive.
  - 'out/main/**'
# The update feed. electron-updater reads it from app-update.yml, which this block makes
# electron-builder write into the app; releases themselves are published by the workflow.
publish:
  provider: github
  owner: anoguez
  repo: styr
mac:
  target:
    # The DMG is for people installing by hand. The zip is what electron-updater downloads, and
    # latest-mac.yml (written alongside) is how an installed copy learns it exists.
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  category: public.app-category.developer-tools
  # Signed with the Developer ID found in the keychain (locally) or decoded from CSC_LINK (CI), and
  # notarised when APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID are set. Without a
  # Developer ID, use `yarn package:adhoc`: skipping signing altogether leaves the bundle's
  # resources unsealed, which macOS reports as "damaged" on any machine that applies Gatekeeper.
  hardenedRuntime: true
  gatekeeperAssess: false
  # The hardened runtime enforces library validation, which blocks the bundled native modules
  # (node-pty, better-sqlite3) under an ad-hoc signature, so it stays disabled for that path.
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
dmg:
  # Sign the DMG itself, not just the app inside it. scripts/notarize-dmg.mjs then notarises and
  # staples it: a signed but unnotarised DMG is rejected by Gatekeeper.
  sign: true
